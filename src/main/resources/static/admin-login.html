<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Online Examination System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #60a5fa);
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #164e9b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #104da3; }

        .message {
            color: #dc2626;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1769d2;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Admin Login</h1>
        <p>Online Examination System</p>

        <form action="/login" method="post">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

            <p class="message" id="message"></p>
        </form>

        <a class="back" href="/">Back to Student Login</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");

        if (params.has("error")) {
            message.textContent = "Invalid username or password. Try again.";
        } else if (params.has("logout")) {
            message.textContent = "You have logged out successfully.";
            message.style.color = "green";
        }
    </script>
</body>
</html>
