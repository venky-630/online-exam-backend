<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Examination System</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #3730a3;
    color: white;
    padding: 18px 20px;
}

header h1 { margin: 0 0 12px; }

.info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.container {
    max-width: 850px;
    margin: 24px auto;
    padding: 0 15px;
}

.question, .result {
    background: white;
    padding: 20px;
    margin-bottom: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
}

.question h3 { margin-top: 0; }

.option {
    display: block;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
}

.option:hover { background: #eef2ff; }

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled { background: #94a3b8; }

#result { display: none; }

@media(max-width: 500px) {
    .question, .result { padding: 15px; }
}
</style>
</head>

<body>

<header>
    <h1>Online Examination System</h1>
    <div class="info">
        <span id="studentInfo"></span>
        <span id="examInfo"></span>
        <span>Time left: <b id="timer">00:00</b></span>
    </div>
</header>

<main class="container">

    <div id="examArea">
        <h2 id="examTitle">Examination</h2>
        <p>20 questions · 1 mark per question</p>

        <form id="examForm">
            <div id="questions"></div>
            <button type="submit" id="submitBtn">Submit Exam</button>
        </form>
    </div>

    <section class="result" id="result">
        <h2>Exam Result</h2>
        <p id="resultName"></p>
        <p id="resultCategory"></p>
        <p id="resultDifficulty"></p>
        <p id="resultScore"></p>
        <p id="resultPercentage"></p>
        <p id="resultTime"></p>
        <p id="resultReason"></p>
        <h3>Suggestions to improve</h3>
        <p id="suggestion"></p>
        <p id="saveStatus" role="status">Saving result...</p>
        <button type="button" onclick="location.href='/index.html'">
            Back to Login
        </button>
    </section>

function mcq(q, options, answer) {
    return { q, options, answer };
}

function makeQuestion(q, a, b, c, d, answer) {
    return mcq(q, [a, b, c, d], answer);

function buildQuestions() {
    const bank = banks[category]?.[level];

    if (!bank) {
        alert("Invalid subject or difficulty. Please login again.");
        location.replace("/index.html");
        return [];
    }

    // Use 20 questions: the selected 10-question bank repeats twice.
    return Array.from({ length: 20 }, (_, i) => {
        const item = bank[i % bank.length];
        return mcq(
            item[0],
            [item[1], item[2], item[3], item[4]],
            item[5]
        );
    });
}

questions = buildQuestions();

const questionBox = document.getElementById("questions");

questions.forEach((item, index) => {
    const section = document.createElement("section");
    section.className = "question";

    const heading = document.createElement("h3");
    heading.textContent = (index + 1) + ". " + item.q;
    section.appendChild(heading);

    item.options.forEach((text, optIndex) => {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "q" + index;
        radio.value = optIndex;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(" " + text));
        section.appendChild(label);
    });

    questionBox.appendChild(section);
});

function updateTimer() {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;

    document.getElementById("timer").textContent =
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");

    if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        finishExam("Time limit reached. Exam submitted automatically.");
    } else {
        secondsLeft--;
    }
}

timerInterval = setInterval(updateTimer, 1000);
updateTimer();

document.getElementById("examForm").addEventListener("submit", function(e) {
    e.preventDefault();
    finishExam("Exam submitted by student.");
});

document.addEventListener("visibilitychange", function() {
    if (document.hidden && !submitted) {
        finishExam(
            "Exam auto-submitted because you switched tabs or left the exam page."
        );
    }
});

async function saveResult(resultData) {
    const response = await fetch("/api/results", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(resultData)
    });

    const responseText = await response.text();

    if (!response.ok) {
        throw new Error("HTTP " + response.status + ": " + responseText);
    }

    return responseText;
}

async function finishExam(reason) {
    if (submitted) return;

    submitted = true;
    clearInterval(timerInterval);

    const timeTaken = Math.min(
        mins * 60,
        Math.floor((Date.now() - startTime) / 1000)
    );

    let score = 0;

    questions.forEach((item, index) => {
        const chosen = document.querySelector(
            'input[name="q' + index + '"]:checked'
        );

        if (chosen && Number(chosen.value) === item.answer) {
            score++;
        }
    });

    const total = questions.length;
    const percent = total ? (score / total) * 100 : 0;

    document.querySelectorAll("#examForm input").forEach(el => {
        el.disabled = true;
    });

    document.getElementById("submitBtn").disabled = true;
    document.getElementById("examArea").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultName").textContent =
        "Student: " + name;
    document.getElementById("resultCategory").textContent =
        "Subject: " + (categoryNames[category] || category);
    document.getElementById("resultDifficulty").textContent =
        "Difficulty: " + level;
    document.getElementById("resultScore").textContent =
        "Score: " + score + " / " + total;
    document.getElementById("resultPercentage").textContent =
        "Percentage: " + percent.toFixed(2) + "%";

    const mm = Math.floor(timeTaken / 60);
    const ss = timeTaken % 60;

    document.getElementById("resultTime").textContent =
        "Time taken: " + mm + " min " + ss + " sec";
    document.getElementById("resultReason").textContent = reason;

    let advice = "";

    if (level === "Easy" && timeTaken > 240) {
        advice = "You took a long time on basic questions. Practise simple questions to improve your speed.";
    } else if (level === "Medium" && timeTaken > 480) {
        advice = "Practise moderate-level questions and improve your problem-solving speed.";
    } else if (level === "Hard" && timeTaken > 720) {
        advice = "Practise challenging questions regularly and improve your time management.";
    } else if (percent < 50) {
        advice = "Review the basic concepts in this subject and practise more MCQs.";
    } else if (percent < 80) {
        advice = "Good effort. Review incorrect answers and practise regularly.";
    } else {
        advice = "Excellent performance! Keep practising to maintain your accuracy.";
    }

    document.getElementById("suggestion").textContent = advice;

    sessionStorage.setItem("examScore", String(score));
    sessionStorage.setItem("examTotal", String(total));
    sessionStorage.setItem("examPercentage", percent.toFixed(2));
    sessionStorage.setItem("examTimeTaken", String(timeTaken));
    sessionStorage.setItem("examReason", reason);

    const saveStatus = document.getElementById("saveStatus");
    saveStatus.textContent = "Saving result to database...";

    try {
        const resultData = {
            studentName: name,
            studentEmail: email,
            category: category,
            difficulty: level,
            score: score,
            totalQuestions: total,
            percentage: Number(percent.toFixed(2)),
            timeTakenSeconds: timeTaken,
            submissionReason: reason
        };

        const responseText = await saveResult(resultData);

        console.log("Database save response:", responseText);
        saveStatus.textContent = "Result saved successfully in the database.";

    } catch (error) {
        console.error("Result save error:", error);
        saveStatus.textContent =
            "Database save failed: " + error.message;
    }
}
